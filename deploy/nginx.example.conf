# Include inside nginx http {}. Generate your own htpasswd and browser certificate.
upstream gd32_board {
    server 127.0.0.1:18080;
    keepalive 2;
}
server {
    listen 443 ssl;
    server_name board.example.com;
    ssl_certificate /etc/nginx/tls/browser.crt;
    ssl_certificate_key /etc/nginx/tls/browser.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "GD32 FRP demo";
    auth_basic_user_file /etc/nginx/gd32-demo.htpasswd;
    location / {
        proxy_pass http://gd32_board;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
